<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Canile «Adotta un amico»</h1>

    <label for="nome"><b>Nome dell'animale:</b></label>
    <input type="text" id="nome" name="nome" required>

    <p>
        <label for="specie"><b>Specie:</b></label>
        <select id="specie" name="specie">
            <option value="0">Scegli la specie</option>
            <option value="Cane">Cane</option>
            <option value="Gatto">Gatto</option>
            <option value="Coniglio">Coniglio</option>
        </select>
    </p>
    

    <p><b>Taglia:</b>
        <input type="radio" id="piccola" name="taglia" value="P">
        <label for="piccola">Piccola</label>
        <input type="radio" id="media" name="taglia" value="M">
        <label for="media">Media</label>
        <input type="radio" id="grande" name="taglia" value="G">
        <label for="grande">Grande</label>
    </p>

    <p><b>Età: </b>
        <input type="number" id="eta" name="eta" min="0" max="20" step="1" value="1" required>
    </p>
    
    <input type="checkbox" id="vaccinato" name="vaccinato" value="1">
    <label for="vaccinato">Vaccinato</label>
    
    <p>
        <button onclick="registra()">Registra</button>
    </p>

    <p id="messaggio"></p>
    <p ><img id="immagine" src="" alt="Immagine specie"; width="120"></p>
    



</body>
</html>
